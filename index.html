<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny English — Aprenda inglês rindo</title>
<style>
  :root{--bg:#0b0f1a;--card:#161d2e;--neon:#22d3ee;--neon2:#a78bfa;--text:#e5e7eb;--muted:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 600px at 70% -10%,#1c2540 0%,var(--bg) 60%);color:var(--text);line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:640px;text-align:center;background:var(--card);border:1px solid #26304a;border-radius:24px;padding:56px 32px}
  .logo{font-size:80px}
  h1{font-size:clamp(28px,6vw,44px);background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0 8px}
  .tag{color:var(--muted);font-size:17px;margin-bottom:28px}
  .links{display:flex;flex-direction:column;gap:12px;align-items:center}
  a.btn{display:inline-block;padding:14px 28px;border-radius:14px;text-decoration:none;font-weight:600;font-size:16px;transition:transform .15s}
  a.btn:hover{transform:translateY(-2px)}
  .primary{background:linear-gradient(90deg,var(--neon),var(--neon2));color:#0b0f1a}
  .ghost{border:1px solid #26304a;color:var(--text)}
  footer{margin-top:32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
  <main class="card">
    <div class="logo">🐶</div>
    <h1>Funny English</h1>
    <p class="tag">Aprenda inglês rindo — com avatares que zoam, corrigem e falam com você.</p>
    <div class="links">
      <a class="btn primary" href="politica-de-privacidade.html">Política de Privacidade</a>
      <a class="btn ghost" href="exclusao-de-conta.html">Exclusão de Conta e Dados</a>
    </div>
    <footer>© 2026 Funny English · contato@funnyenglish.app</footer>
  </main>
</body>
</html>
